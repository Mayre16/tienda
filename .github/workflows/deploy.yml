name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SITE_URL: https://tienda.acropolis.org.do
          NEXT_PUBLIC_PRINCIPAL_URL: https://acropolis.org.do
          NEXT_PUBLIC_CIVIS_URL: https://civis.acropolis.org.do
          NEXT_PUBLIC_CMS_URL: https://editor.acropolis.adesa.com.do/api
          NEXT_PUBLIC_STORE_API_URL: https://biblioteca-oina.adesa.com.do
          NEXT_PUBLIC_BIBLIOTECA_API_URL: https://biblioteca-oina.adesa.com.do
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
